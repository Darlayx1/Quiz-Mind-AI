name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: node --import tsx scripts/model-test.ts
      - run: node --import tsx scripts/workspace-test.ts
      - run: node --import tsx scripts/workspace-ai-test.ts
      - run: node --import tsx scripts/workspace-generation-test.ts
      - run: node --import tsx scripts/quiz-types-test.ts
      - run: npm run build:pages
        env:
          VITE_BASE_PATH: /Quiz-Mind-AI/
          VITE_SUPABASE_URL: https://btsvqhlfkkgwkqsezzoq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0_-VQxC-t2qEMzJTy63SkQ_-BYp-ZQM
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - uses: actions/deploy-pages@v4
        id: deployment
